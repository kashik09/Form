<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up: Practice Form</title>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f8fa;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        fieldset {
            border: 1px solid lightgrey;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
        }

        legend {
            font-size: 20px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid lightgrey;
            margin-bottom: 15px;
            font-size: 14px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>Sign Up</legend>
            <label for="first_name">First Name:</label>
            <input type="text" name="first_name" id="first_name" placeholder="e.g., John" minlength="2" required>

            <label for="last_name">Last Name:</label>
            <input type="text" name="last_name" id="last_name" placeholder="e.g., Doe" minlength="2" required>

            <label for="email">Email Address:</label>
            <input type="email" name="email" id="email" placeholder="e.g., john.doe@student.moringaschool.com"
                pattern="^[a-z]+\.[a-z]+@student\.moringaschool\.com$" required>

            <label for="phone_number">Phone Number:</label>
            <input type="tel" name="phone_number" id="phone_number" placeholder="+254712345678"
                pattern="^\+2547[0-9]{8}$" required>

            <label for="password">Password:</label>
            <input type="password" name="password" id="password" placeholder="Enter a strong password"
                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" required>

            <button type="submit">Join Now</button>
        </fieldset>
    </form>
</body>
</html>
